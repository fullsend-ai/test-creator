id: jira
display_name: Jira (read-only)
description: Read-only Jira access for test-plan comparison runs
category: data
credentials:
  - name: api_token
    description: Jira API token
    env_vars: [JIRA_TOKEN]
    required: true
endpoints:
  - host: "redhat.atlassian.net"
    port: 443
    protocol: rest
    enforcement: enforce
    access: read-only
  # Attachment content URLs (/rest/api/2/attachment/content/<id>) redirect to the media CDN.
  - host: "api.media.atlassian.com"
    port: 443
    protocol: rest
    enforcement: enforce
    access: read-only
binaries:
  - "**/python"
  - "**/python*"
  - "**/python3"
  - "**/curl"
