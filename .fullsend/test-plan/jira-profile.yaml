---
id: jira
display_name: Jira
description: Jira access for test-plan generation
category: data
credentials:
  - name: api_token
    description: Jira API token
    env_vars: [JIRA_TOKEN]
    required: true
endpoints:
  - host: "redhat.atlassian.net"
    port: 443
    protocol: rest
    enforcement: enforce
    access: read-write
  # Attachment content URLs (/rest/api/2/attachment/content/<id>) redirect to the media CDN.
  # Downloads are reads, so this host stays read-only even in the read-write profile.
  - host: "api.media.atlassian.com"
    port: 443
    protocol: rest
    enforcement: enforce
    access: read-only
binaries:
  - "**/python"
  - "**/python*"
  - "**/python3"
  - "**/curl"
